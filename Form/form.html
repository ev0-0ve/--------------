<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тренировка на кор</title>
    <link rel="stylesheet" href="Style/form.css">
</head>
<body>
    <section class="main">
        <img src="./img/Imagehome-2.png" width="459" height="220" lt="Тренирующиеся люди с гирями в спортзале">
        <p id="title">Тренировка на кор</p>
        <p id="#text_title">Тренировка на кор (core) — это функциональный тренинг, <br>
            направленный на укрепление глубоких мышц живота,<br> 
            спины, таза и ягодиц, стабилизирующих позвоночник. <br>
        </p>
        <div class="record">
            <button class="herobutton">ЗАПИСАТЬСЯ</button>
            <form action="get">
                <select name="Дата" class="data">
                    <option value="12">12.04.26</option>
                    <option value="13">13.04.26</option> 
                    <option value="14">15.04.26</option> 
                    <option value="16">16.04.26</option>
                </select><br>
            </form>
        </div>
        <div>
            <form action="get" class="info">
                <input type="Name" placeholder="ИМЯ ТРЕНЕРА" required>
                <textarea name="discription" id="discription" placeholder="Отзыв"></textarea><br>
            </form>
        </div>
    </section>
</body>
</html>
